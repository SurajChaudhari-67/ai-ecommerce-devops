---
- name: Apply kernel hardening settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-nexvion-hardening.conf
    mode: "0644"
    content: |
      net.ipv4.tcp_syncookies = 1
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.all.rp_filter = 1
      kernel.randomize_va_space = 2
  register: sysctl_file

- name: Reload sysctl settings
  ansible.builtin.command: sysctl --system
  when: sysctl_file.changed
  failed_when: false

- name: Install unattended security upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Check if sshd_config exists
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: sshd_config

- name: Harden SSH settings
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?{{ item.key }}"
    line: "{{ item.key }} {{ item.value }}"
  loop:
    - { key: PermitRootLogin, value: "no" }
    - { key: X11Forwarding, value: "no" }
    - { key: MaxAuthTries, value: "3" }
  when: sshd_config.stat.exists
  notify: Reload ssh
